# Every port binds to 127.0.0.1 only. Postgres and Redis are not published at all
# (see docker-compose.dev.yml for running the backend outside Docker).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aeo
      POSTGRES_PASSWORD: aeo
      POSTGRES_DB: aeo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeo -d aeo"]
      interval: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://aeo:aeo@postgres:5432/aeo
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["${PUBLIC_URL:-http://localhost:3000}"]'
      # trust X-Forwarded-For from a reverse proxy, so the rate limit sees real client IPs
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
